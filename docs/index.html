<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>安托萨 · Anthousa</title>
<style>
:root{--ink:#3b2a1a;--paper:#f3e7c9;--deep:#1d1610;--line:#4a3a2a;--gold:#e6c27a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--deep);color:var(--paper);font-family:Georgia,"Songti SC","Noto Serif SC",serif;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;height:52px;padding:0 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-weight:normal;letter-spacing:.3em;font-size:20px;white-space:nowrap}
header .sub{opacity:.65;font-style:italic;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line)}
.lang button{background:none;border:0;color:var(--paper);font:inherit;font-size:13px;padding:5px 12px;cursor:pointer;opacity:.55}
.lang button.on{background:#3a2d20;opacity:1}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px}
#stage{position:relative;overflow:hidden;background:#b8b29b;cursor:grab}
#stage img{position:absolute;left:0;top:0;width:100%;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
#stage .hint{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--ink);opacity:.65;background:#f3e7c9cc;padding:2px 8px}
aside{display:flex;flex-direction:column;min-height:0;background:#241b13;border-left:1px solid var(--line)}
.top{flex:none;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.top h2{font-weight:normal;font-size:20px;margin:0;letter-spacing:.06em}
.years{opacity:.6;font-style:italic;font-size:13px;margin:2px 0 10px}
.stats{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:12px;align-items:center}
.bar{height:5px;background:#3a2d20;position:relative}.bar i{position:absolute;left:0;top:0;bottom:0;background:#c98f4e}
.bar.w i{background:#6f8fa0}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--paper);font:inherit;font-size:13px;padding:9px 4px;cursor:pointer;opacity:.55;letter-spacing:.1em}
.tabs button.on{opacity:1;border-bottom-color:#c98f4e}
.pane{flex:1;min-height:0;overflow-y:auto;padding:14px 20px;display:none}
.pane.on{display:block}
.chron{line-height:1.8;font-size:14px}.chron p{margin:0 0 .9em}
.chron b.ref{color:var(--gold);font-weight:normal;border-bottom:1px dotted var(--gold);cursor:help}
.act{font-size:13px;margin:3px 0;opacity:.9}.act .f{display:inline-block;min-width:72px;opacity:.6}
.rej{color:#e39a86}.rej small{display:block;opacity:.8;margin-left:76px}
.ev{color:#f0b46a;font-size:13px}
.how{font-size:13px;opacity:.8;line-height:1.75}
footer{flex:none;height:58px;padding:0 20px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px}
footer button{background:none;border:1px solid var(--paper);color:var(--paper);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;white-space:nowrap}
#tl{flex:1;position:relative;height:40px}
#tl input{width:100%;margin-top:18px;accent-color:#c98f4e}
#tl .tick{position:absolute;top:0;font-size:11px;opacity:.6;transform:translateX(-50%);white-space:nowrap}
#yearbig{font-size:24px;min-width:120px;text-align:right}
#yearbig small{display:block;font-size:10px;opacity:.6;letter-spacing:.2em}
@media(max-width:900px){
 body{overflow:auto;height:auto}main{grid-template-columns:1fr}#stage{height:55vh}
 aside{border-left:0;height:60vh}header .sub{display:none}footer{position:sticky;bottom:0;background:var(--deep)}}
</style>
</head>
<body>
<header>
  <h1>ANTHOUSA · 安托萨</h1><span class="sub" data-t="sub"></span>
  <div class="lang"><button id="lzh">中文</button><button id="len">EN</button></div>
</header>
<main>
  <div id="stage"><img id="map" alt="map"><span class="hint" data-t="hint"></span></div>
  <aside>
    <div class="top"><h2 id="title"></h2><div class="years" id="yrs"></div><div class="stats" id="stats"></div></div>
    <div class="tabs"><button data-p="pc" class="on" data-t="t1"></button><button data-p="pa" data-t="t2"></button><button data-p="ph" data-t="t3"></button></div>
    <div class="pane on" id="pc"><div id="events"></div><div class="chron" id="chron"></div></div>
    <div class="pane" id="pa"><div id="acts"></div></div>
    <div class="pane" id="ph"><div class="how" data-t="how"></div></div>
  </aside>
</main>
<footer>
  <button id="play"></button>
  <div id="tl"><input type="range" id="slider" min="0" value="0" step="1"></div>
  <div id="yearbig"></div>
</footer>
<script>
const T={
 zh:{sub:"一座没有人设计、自己生长出来的城市",hint:"滚轮缩放 · 拖动平移",t1:"编年史",t2:"议事厅",t3:"它如何生长",
  play:"▶ 播放",pause:"❚❚ 暂停",pop:"人口",food:"粮食上限",water:"水源上限",houses:"房屋",nochron:"编年史尚未写成。",
  fac:{emperor:"皇帝",church:"教会",merchants:"商人",people:"平民",army:"军队",settlers:"移民",priests:"祭司"},
  op:{build:"兴建",demolish:"拆除",rename:"更名"},ev:{fire:"大火",earthquake:"地震",plague:"瘟疫"},
  evline:(y,t,h)=>`⚑ ${y} 年 · ${t}${h?"，"+h+" 座房屋损毁":""}`,round:r=>`第 ${r} 轮审议被驳回、后经修改：`,
  yl:y=>y<=0?(y<0?`前 ${-y} 年`:"建城前夕"):`建城 ${y} 年`,big:y=>y<0?"前 "+(-y):y,now:"至今",
  how:"每一次心跳，城市就过去十年。皇帝、教会、商人、平民、军队各自提出要建什么；一套用代码写成的规则引擎逐条裁决：是否在陆地上、是否压住了别的建筑、有没有路能到、水和粮食够不够。被驳回的提案原样记录在“议事厅”里。房屋沿着街道自行生长，火灾、地震与瘟疫由骰子决定，没有人能选择。拆掉的城墙、烧掉的街区不会消失，它们的地基一直留在地图上。<br><br>地形是真实的：海岸线来自 OpenStreetMap，高程来自 SRTM，地图 1 格 = 12 米。",
  reason:r=>r.replace(/^.*?: /,"").replace(/no road within 25 units; nobody could reach it/,"25 格内没有道路，无人能到达").replace(/road does not connect to the existing street network/,"道路没有接入现有路网").replace(/a district needs a road running into it/,"街区需要有道路通入").replace(/aqueduct would have to run uphill/,"水渠得往高处流").replace(/footprint leaves dry land \((\d+) sq units in water\)/,"占地伸进水里（$1 平方格）").replace(/overlaps standing (\w+) \((.*)\)/,"压住了现有建筑 $2").replace(/a harbor must sit on the shore, mostly in the water/,"港口必须建在岸边、大部分在水中").replace(/id already used/,"编号已被占用")},
 en:{sub:"A city nobody designed, growing on its own",hint:"Scroll to zoom · drag to pan",t1:"Chronicle",t2:"Council",t3:"How it grows",
  play:"▶ Play",pause:"❚❚ Pause",pop:"Population",food:"Grain capacity",water:"Water capacity",houses:"Houses",nochron:"The chronicle is not yet written.",
  fac:{emperor:"Emperor",church:"Church",merchants:"Merchants",people:"People",army:"Army",settlers:"Settlers",priests:"Priests"},
  op:{build:"builds",demolish:"demolishes",rename:"renames"},ev:{fire:"Great fire",earthquake:"Earthquake",plague:"Plague"},
  evline:(y,t,h)=>`⚑ Year ${y} · ${t}${h?", "+h+" houses lost":""}`,round:r=>`Rejected in review round ${r}, then revised:`,
  yl:y=>y<=0?(y<0?`${-y} BC`:"Eve of the refounding"):`AF ${y}`,big:y=>y<0?(-y)+" BC":y,now:"present",
  how:"Every heartbeat, ten years pass. Emperor, church, merchants, people and army each propose what to build; a rules engine written in code judges every proposal: is it on land, does it sit on another building, can a road reach it, is there enough water and grain. Rejected proposals stay on record in the Council tab. Houses grow along the streets by themselves; fires, earthquakes and plagues come from the dice, and nobody chooses them. Demolished walls and burned quarters never vanish: their foundations stay on the map.<br><br>The terrain is real: coastline from OpenStreetMap, elevation from SRTM; one map unit = 12 m.",
  reason:r=>r.replace(/^.*?: /,"")}};
let L=localStorage.getItem("lang")||((navigator.language||"").startsWith("zh")?"zh":"en");
let D,names={},idx=0,timer=null;
const $=id=>document.getElementById(id);
const fname=y=>"years/"+(L=="zh"?"zh/":"")+(y<0?"m"+String(-y).padStart(4,"0"):String(y).padStart(5,"0"))+".svg";
const nm=s=>L=="zh"&&s.name_zh?s.name_zh:s.name;
function setLang(l){L=l;localStorage.setItem("lang",l);document.documentElement.lang=l;const t=T[l];
  document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=t[e.dataset.t]);
  $("lzh").classList.toggle("on",l=="zh");$("len").classList.toggle("on",l=="en");
  $("play").textContent=timer?t.pause:t.play;if(D)show(idx)}
$("lzh").onclick=()=>setLang("zh");$("len").onclick=()=>setLang("en");
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button,.pane").forEach(x=>x.classList.remove("on"));b.classList.add("on");$(b.dataset.p).classList.add("on")});
setLang(L);
fetch("data.json").then(r=>r.json()).then(d=>{D=d;d.structures.forEach(s=>names[s.id]=s);
  const sl=$("slider");sl.max=d.eras.length-1;sl.value=d.eras.length-1;
  d.eras.forEach((e,i)=>{const t=document.createElement("span");t.className="tick";t.style.left=(d.eras.length>1?i/(d.eras.length-1)*100:0)+"%";t.textContent=e.to;$("tl").appendChild(t)});
  d.eras.forEach(e=>["","zh/"].forEach(p=>{const im=new Image();im.src="years/"+p+fname(e.to).replace(/^years\/(zh\/)?/,"")}));
  show(d.eras.length-1);sl.oninput=()=>show(+sl.value)});
function md(t){const tt=T[L];return t.replace(/^## .*$/m,"").trim().split(/\n\s*\n/).map(p=>"<p>"+p.replace(/\{\{(\w+)\}\}/g,(m,id)=>{const s=names[id];
  if(!s)return id;const life=`${s.built}${s.destroyed!=null?" – "+s.destroyed:" – "+tt.now}`;
  const hist=(s.history||[]).map(h=>h.year+": "+h.text).join("\n");return `<b class="ref" title="${life}\n${hist.replace(/"/g,"'")}">${nm(s)}</b>`})+"</p>").join("")}
function show(i){idx=i;const e=D.eras[i],t=T[L];$("map").src=fname(e.to);
  $("title").textContent=L=="en"&&e.title_en?e.title_en:e.title;
  $("yrs").textContent=`${t.yl(e.from)} — ${t.yl(e.to)}`;$("yearbig").innerHTML=`${t.big(e.to)}<small>${e.to>0?"ANNO FUNDATIONIS":"ANTE"}</small>`;
  const s=e.stats,m=Math.max(s.food,s.water,s.population),loc=L=="zh"?"zh-CN":"en-US";
  $("stats").innerHTML=`<span>${t.pop}</span><div class="bar"><i style="width:${s.population/m*100}%"></i></div><span>${s.population.toLocaleString(loc)}</span>
   <span>${t.food}</span><div class="bar"><i style="width:${s.food/m*100}%"></i></div><span>${s.food.toLocaleString(loc)}</span>
   <span>${t.water}</span><div class="bar w"><i style="width:${s.water/m*100}%"></i></div><span>${s.water.toLocaleString(loc)}</span>
   <span>${t.houses}</span><span></span><span>${s.houses.toLocaleString(loc)} <small>(+${s.houses_added})</small></span>`;
  const c=L=="en"?e.chronicle_en:e.chronicle;$("chron").innerHTML=c?md(c):`<p><i>${t.nochron}</i></p>`;
  $("events").innerHTML=(e.events||[]).map(v=>`<p class="ev">${t.evline(v.year,t.ev[v.type],v.houses)}</p>`).join("");
  const n=x=>names[x.id]?nm(names[x.id]):(L=="zh"&&D.names_zh&&D.names_zh[x.id])||x.name||x.id;
  let h=e.accepted.map(a=>`<div class="act"><span class="f">${t.fac[a.faction]||a.faction}</span>${t.op[a.op]} ${n(a)}</div>`).join("");
  h+=e.rejected.map(r=>`<div class="act rej"><span class="f">${t.fac[r.faction]||r.faction}</span>✕ ${n(r)}<small>${r.reasons.map(t.reason).join(L=="zh"?"；":"; ")}</small></div>`).join("");
  (e.review_rounds||[]).forEach(rr=>{h+=`<div class="act" style="opacity:.65;margin-top:10px">${t.round(rr.round)}</div>`+rr.rejected.map(x=>`<div class="act rej" style="opacity:.75"><span class="f"></span>✕ ${x.id}<small>${x.reason} → ${x.fix}</small></div>`).join("")});
  $("acts").innerHTML=h;}
$("play").onclick=()=>{const t=T[L];if(timer){clearInterval(timer);timer=null;$("play").textContent=t.play;return}
  $("play").textContent=t.pause;if(idx>=D.eras.length-1)show(0),$("slider").value=0;
  timer=setInterval(()=>{if(idx>=D.eras.length-1){$("play").click();return}show(idx+1);$("slider").value=idx},1600)};
let z=1,px=0,py=0,drag=null;const st=$("stage"),im=$("map");
const ap=()=>im.style.transform=`translate(${px}px,${py}px) scale(${z})`;
st.addEventListener("wheel",ev=>{ev.preventDefault();const r=st.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const nz=Math.min(12,Math.max(1,z*(ev.deltaY<0?1.15:1/1.15)));px=mx-(mx-px)*nz/z;py=my-(my-py)*nz/z;z=nz;ap()},{passive:false});
st.onmousedown=ev=>{drag=[ev.clientX-px,ev.clientY-py];st.style.cursor="grabbing"};
onmouseup=()=>{drag=null;st.style.cursor="grab"};
onmousemove=ev=>{if(drag){px=ev.clientX-drag[0];py=ev.clientY-drag[1];ap()}};
let tp=null;st.addEventListener("touchstart",ev=>{if(ev.touches.length==1)tp=[ev.touches[0].clientX-px,ev.touches[0].clientY-py]},{passive:true});
st.addEventListener("touchmove",ev=>{if(tp&&ev.touches.length==1){ev.preventDefault();px=ev.touches[0].clientX-tp[0];py=ev.touches[0].clientY-tp[1];ap()}},{passive:false});
im.onload=()=>{if(im.dataset.init)return;im.dataset.init=1;const r=st.getBoundingClientRect();z=2.2;px=-r.width*0.62*z+r.width*0.5;py=-r.width*(400/1200)*z+r.height*0.5;ap()};
</script>
</body>
</html>
