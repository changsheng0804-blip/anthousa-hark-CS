function enterWalk(x,z,yw){const n=nearSeg(x,z);if(!n)return;wx=n.px;wz=n.pz;yaw=yw!=null?yw:Math.atan2(n.dx,-n.dz);pitch=-.04;ensureAround(wx,wz,260);DG={tx:wx,tz:wz,wx,wz,yaw,pitch};DESC=1;FOGF=900;STROLL=true;ctl.enabled=false;

let drag=null,d0=null,PANR=false;rnd.domElement.addEventListener('pointerdown',e=>{if(STROLL){PANR=e.button===2;drag=[e.clientX,e.clientY];d0=PANR?null:[e.clientX,e.clientY,performance.now()]}});
addEventListener('pointerup',e=>{if(STROLL&&d0&&Math.hypot(e.clientX-d0[0],e.clientY-d0[1])<6&&performance.now()-d0[2]<400&&e.target===rnd.domElement){const r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),pcam);const h=r.intersectObject(terr)[0];if(h)glideTo(h.point.x,h.point.z)}drag=null;d0=null});
addEventListener('pointermove',e=>{if(!STROLL||!drag)return;if(PANR){/* 右键拖：在街上平移（跟着手走，像拖地图） */const st=.04/MPP*EX,ddx=-(e.clientX-drag[0])*st,ddy=(e.clientY-drag[1])*st;[wx,wz]=clampToStreet(wx+Math.cos(yaw)*ddx+Math.sin(yaw)*ddy,wz+Math.sin(yaw)*ddx-Math.cos(yaw)*ddy);walkPose();drag=[e.clientX,e.clientY];return}yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-.9,Math.min(.6,pitch-(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY]});
rnd.domElement.addEventListener('dblclick',e=>{if(STROLL)return;const r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),cam);const h=r.intersectObject(terr)[0];if(h){look(h.point.x,h.point.z);dGoal=1;gT=performance.now()}});

/* 方向键微调镜头（主人 10-19）：长卷里平移画面；街上左右横移、上下前后挪一小步（WASD 仍是走路和转身） */
const NUDGE={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,1],arrowdown:[0,-1]};
addEventListener('keydown',e=>{const k=e.key.toLowerCase(),n=NUDGE[k];if(!n||e.target.tagName==='INPUT')return;e.preventDefault();
  if(STROLL){const st=(e.shiftKey?2.5:.6)/MPP*EX,sx=Math.cos(yaw),sz=Math.sin(yaw),fx=Math.sin(yaw),fz=-Math.cos(yaw);[wx,wz]=clampToStreet(wx+sx*n[0]*st+fx*n[1]*st,wz+sz*n[0]*st+fz*n[1]*st);walkPose()}

addEventListener('keydown',e=>{if(!STROLL)return;if(e.key==='Shift')RUN=true;const k=e.key.toLowerCase();if(k==='w')mv=1;if(k==='s')mv=-1;if(k==='a')turn=-1;if(k==='d')turn=1;if(k==='escape')exitWalk()});
addEventListener('keyup',e=>{if(e.key==='Shift')RUN=false;const k=e.key.toLowerCase();if(k==='w'||k==='s')mv=0;if(k==='a'||k==='d')turn=0});
window.__walk=(x,z,yw,p)=>{enterWalk(x,z,yw);if(p!=null)pitch=p;walkPose()};window.__glide=(x,z)=>{glideTo(x,z);return !!GL};window.__walkMove=(m)=>{const sp=m;[wx,wz]=clampToStreet(wx+Math.sin(yaw)*sp,wz-Math.cos(yaw)*sp);walkPose();return [wx,wz]};

rnd.setAnimationLoop(()=>{goStep();if(STROLL)walkStep();else if(DESC>0)descPose();else ctl.update();lod();anim();pplStep();comp.uniforms.zk.value=1/cam.zoom;comp.uniforms.ps.value=(STROLL||DESC>0)?1:0;const AC=(STROLL||DESC>0)?pcam:cam;crowdStep(AC);tipStep(AC);

  rnd.setRenderTarget(null);rnd.render(ppS,ppC);
  fN++;const t=performance.now();if(t-fT>1000){window.__fps=fN*1000/(t-fT);$('fps').textContent=window.__fps.toFixed(0)+' fps'+(CRW?' · '+CRW.stat.active+'人/'+CRW.stat.full+'近 '+CRW.stat.ms.toFixed(1)+'ms':'');fN=0;fT=t}});
window.__look=look;window.__comp=comp;
window.__view=(x,z,zm)=>look(x,z,zm);window.__under=(x,y)=>{const r=new THREE.Raycaster();r.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-y/innerHeight*2+1),cam);const h=r.intersectObject(terr)[0];return h?[Math.round(h.point.x),Math.round(h.point.z),+cam.zoom.toFixed(2)]:null};window.__setYear=Y=>{YEAR=Y;$('yr').value=Y;build()};window.__ready=1;T_('ready');
/* 嵌在全城瓦片里（灰度 nodes-nangang）：瓦片缩到底再往里缩时，瓦片页在同一个点、同样比例叠上这一页，再接着落街；
   在这里往外缩回到接进来时的比例以下，就把镜头位置交回瓦片页，瓦片淡回来 */
const EP=new URLSearchParams(location.search);if(EP.get('embed')){const ex=+EP.get('x'),ey=+EP.get('y'),ez=+EP.get('z');let gone=false;
  $('tag').style.display='none';$('fps').style.display='none';

  look(ex,ey,Math.max(ctl.minZoom,Math.min(ctl.maxZoom,ez)));ctl.minZoom=Math.max(.35,ez*.7);
  const bk=document.createElement('button');bk.textContent='← 全城';bk.style.cssText='position:fixed;left:12px;top:10px;font:inherit;border:1px solid #b9a582;background:#fbf5e6;border-radius:8px;padding:4px 10px';document.body.appendChild(bk);
  const out=()=>{if(gone)return;gone=true;parent.postMessage({t:'exit',x:ctl.target.x,y:ctl.target.z,z:cam.zoom},'*')};bk.onclick=()=>{if(STROLL||DESC>0){dGoal=0;const iv=setInterval(()=>{if(DESC===0){clearInterval(iv);out()}},100)}else out()};
  addEventListener('keydown',e=>{if(e.key==='Escape'&&!STROLL&&DESC===0)out()});
  (function w(){if(!gone&&!STROLL&&DESC===0&&cam.zoom<=ez*.78)out();requestAnimationFrame(w)})();
