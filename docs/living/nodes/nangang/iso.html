<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>南港 · 等轴重绘（第 65 年）</title>
<!-- CS 线 · 2026-11-05：南港全图等轴重绘的看图页。独立页，不改别的页。
     图：3D 渲染器同一台全局正交等轴相机分块出图 → generate_image 半窗滑动重绘（接缝法学自 Isopolis）→ 水按底账统一盖章。
     做法与数字：docs/cs/lookdev/iso_repaint/nangang.md。瓦片 iso/z{0,1,2}/x_y.jpg，512px，三级。 -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#eee7d6;font-family:"Noto Serif SC","Songti SC",serif;color:#2b2218;-webkit-user-select:none;user-select:none}
#v{position:fixed;inset:0;touch-action:none;cursor:grab;overflow:hidden}#v.drag{cursor:grabbing}
#w{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#w img{position:absolute;display:block;pointer-events:none;-webkit-user-drag:none}
#tag{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:rgba(250,244,230,.9);border:1px solid #b9a582;border-radius:10px;padding:6px 11px;font-size:13px;line-height:1.5;max-width:min(78vw,460px)}
#tag b{font-size:16px}#tag a{color:#7a3e1c}
#zb{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px}
#zb button{width:40px;height:40px;border-radius:10px;border:1px solid #b9a582;background:rgba(250,244,230,.93);font-size:20px;color:#4a3a26}
#cr{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));font-size:11px;color:#6a5a40;background:rgba(250,244,230,.75);padding:3px 8px;border-radius:7px;max-width:calc(100vw - 90px)}
#cr a{color:#6a4a2c}
</style></head><body>
<div id="v"><div id="w"></div></div>
<div id="tag"><b>南港 · 等轴重绘</b>　建城第 65 年。拖动平移，滚轮或双指缩放。<a href="3d.html">3D</a> · <a href="./">2D</a></div>
<div id="zb"><button id="zi" aria-label="放大">+</button><button id="zo" aria-label="缩小">&minus;</button><button id="zf" aria-label="全图">⤢</button></div>
<div id="cr">3D 渲染逐块交给图生图重画；接缝做法学自 <a href="https://sf.isopolis.city/dev.html">Isopolis</a>，画风参照 Isometric SF / Isometric Toronto；水面按底账统一盖章；接缝另开以缝为中心的纠正窗重画，自动闸门打分。底账 nodes.json。——Hark（CS线）</div>
<script>
(async()=>{
const M=await (await fetch('iso/meta.json',{cache:'no-cache'})).json(),W=M.W,H=M.H,T=M.tile;
const v=document.getElementById('v'),w=document.getElementById('w');
w.style.width=W+'px';w.style.height=H+'px';
const layers=M.levels.map(L=>{const d=document.createElement('div');d.style.position='absolute';d.style.inset='0';w.appendChild(d);return {L,d,tiles:new Map()}});
let s=1,tx=0,ty=0,fitS=1;
function fit(){const r=v.getBoundingClientRect();fitS=Math.min(r.width/W,r.height/H)*0.96;s=fitS;tx=(r.width-W*s)/2;ty=(r.height-H*s)/2;apply()}
function clampS(x){return Math.max(fitS*0.8,Math.min(2.5,x))}
function want(){return s<=0.32?0:s<=0.7?1:2}
function tile(Ly,x,y){const k=x+'_'+y;if(Ly.tiles.has(k))return;const L=Ly.L,img=new Image(),u=T/L.scale;
 img.decoding='async';img.src=`iso/z${L.z}/${k}.jpg?v=${M.v||''}`;img.style.left=x*u+'px';img.style.top=y*u+'px';
 img.style.width=Math.min(T,L.w-x*T)/L.scale+'px';img.style.height=Math.min(T,L.h-y*T)/L.scale+'px';Ly.d.appendChild(img);Ly.tiles.set(k,img)}
function load(){const r=v.getBoundingClientRect();const z=want();
 for(const Ly of layers){const L=Ly.L;if(L.z!==0&&L.z!==z){continue}
  const u=T/L.scale,x0=Math.max(0,Math.floor((-tx/s)/u)),y0=Math.max(0,Math.floor((-ty/s)/u)),x1=Math.min(L.nx-1,Math.floor(((r.width-tx)/s)/u)),y1=Math.min(L.ny-1,Math.floor(((r.height-ty)/s)/u));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)tile(Ly,x,y)}
 for(const Ly of layers)Ly.d.style.display=(Ly.L.z===0||Ly.L.z===z)?'':'none'}
let raf=0;function apply(){w.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;if(!raf)raf=requestAnimationFrame(()=>{raf=0;load()})}
function zoomAt(f,cx,cy){const ns=clampS(s*f);tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply()}
v.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
const P=new Map();let last=null,lastTap=0;
v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);v.classList.add('drag');
 if(P.size===1){const t=performance.now();if(t-lastTap<300)zoomAt(2,e.clientX,e.clientY);lastTap=t}last=null});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const prev=P.get(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);
 if(P.size===1){tx+=e.clientX-prev[0];ty+=e.clientY-prev[1];apply()}
 else if(P.size===2){const [a,b]=[...P.values()],cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2,d=Math.hypot(a[0]-b[0],a[1]-b[1]);
  if(last){tx+=cx-last.cx;ty+=cy-last.cy;zoomAt(d/last.d,cx,cy)}last={cx,cy,d}}});
const up=e=>{P.delete(e.pointerId);last=null;if(!P.size)v.classList.remove('drag')};v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
const r0=()=>v.getBoundingClientRect();
document.getElementById('zi').onclick=()=>zoomAt(1.6,r0().width/2,r0().height/2);
document.getElementById('zo').onclick=()=>zoomAt(1/1.6,r0().width/2,r0().height/2);
document.getElementById('zf').onclick=fit;
addEventListener('resize',fit);fit();window.__iso={get s(){return s},zoomAt,fit};
})();
</script>
</body></html>
