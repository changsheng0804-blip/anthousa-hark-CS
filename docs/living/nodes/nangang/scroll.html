let HGRID=null;function houseGrid(){HGRID=new Map();for(const f of by.house||[]){if(!live(f))continue;const p=f.p;let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(let i=0;i<p.length;i+=2){x0=Math.min(x0,p[i]);x1=Math.max(x1,p[i]);z0=Math.min(z0,p[i+1]);z1=Math.max(z1,p[i+1])}

let lastT=performance.now();

let GL=null,RUN=false;function glideTo(x,z){const n=nearSeg(x,z);if(!n)return;GL={ax:wx,az:wz,bx:n.px,bz:n.pz,t:0,T:Math.min(1.1,.35+Math.hypot(n.px-wx,n.pz-wz)/400),hop:Math.min(60,8+Math.hypot(n.px-wx,n.pz-wz)*.12)}}
function walkStep(){const t=performance.now(),dt=Math.min(.05,(t-lastT)/1000);lastT=t;yaw+=turn*dt*1.4;

/* 缩放一路进街：长卷缩到最大以后再往里缩，镜头不换页面，而是从斜俯正交平滑变成透视——

let DG=null,dGoal=null;const wr=a=>Math.atan2(Math.sin(a),Math.cos(a));

function descPose(){const s=DESC,D0=(VH/cam.zoom)/(2*Math.tan(3*Math.PI/180));const top=new THREE.Vector3(DG.tx,0,DG.tz).addScaledVector(DIR,D0);
  const gy=elevPx(DG.wx,DG.wz)+1.5+EYE,h=1-Math.pow(1-s,2);const x=top.x+(DG.wx-top.x)*h,z=top.z+(DG.wz-top.z)*h;

function descBy(d){if(!d)return;
