<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>安托萨 · 全城瓦片实验（CS 线 cs33）</title>
<style>html,body{margin:0;height:100%;background:#1a140c;color:#efe4cc;font-family:"Songti SC","Noto Serif SC",serif;overflow:hidden}
canvas{display:block;touch-action:none}#ui{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.b{background:rgba(26,20,12,.85);color:#efe4cc;border:1px solid rgba(212,168,90,.5);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}.b.on{background:rgba(212,168,90,.3)}
#st{position:fixed;left:12px;bottom:10px;font-size:12px;color:#c9b48c;background:rgba(26,20,12,.7);padding:4px 8px;border-radius:6px}</style></head>
<body><canvas id="c"></canvas><div id="ui"></div><div id="st"></div>
<script>
/* CS 线 · cs33 瓦片实验：浏览器只拼离线烤好的瓦片（tile_bake.py），按缩放挑级，只取视口里的瓦片。——Hark（CS线） */
(async()=>{
const M=await fetch('meta.json').then(r=>r.json());const TP=M.tile_px,NL=Object.keys(M.levels).length;
const NAMES={nangang:'南港',jinjiao:'金角岸'};
const c=document.getElementById('c'),ctx0=c.getContext('2d');let ctx=ctx0;const off=document.createElement('canvas'),octx=off.getContext('2d');let W,H,dpr=Math.min(2,window.devicePixelRatio||1);
function rs(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;off.width=Math.ceil(W*PCK*dpr);off.height=Math.ceil(H*PCK*dpr);c.style.width=W+'px';c.style.height=H+'px';dirty=true;cver++}
let dirty=true,cver=0;const PCK=1.6,pc={ok:false};addEventListener('resize',rs);
const WW=M.grid[0]*TP,WH=M.grid[1]*TP;   /* 级 0 像素坐标 */
const cam={x:WW/2,y:WH/2,z:Math.min(innerWidth/WW,innerHeight/WH)*0.95};
let YEAR=M.years[M.years.length-1],prevYear=null,fade=0;
const cache=new Map();let loads=0,bytesSeen=0;
function tile(Y,l,tx,ty,gr){const k=gr?Y+'/'+tx+'_'+ty:Y+'/'+l+'/'+tx+'_'+ty;let t=cache.get(k);if(t!==undefined)return t;const lv=gr?{grid:M.grid}:M.levels[l][Y];if(tx<0||ty<0||tx>=lv.grid[0]||ty>=lv.grid[1]){cache.set(k,null);return null}
  const im=new Image();t={im,ok:false,miss:false};im.onload=()=>{t.ok=true;dirty=true;cver++};im.onerror=()=>{t.miss=true};im.src=k+'.webp';loads++;cache.set(k,t);
  if(cache.size>220){for(const [kk,v] of cache){if(cache.size<=160)break;if(!v||v.ok||v.miss)cache.delete(kk)}}return t}
function level(){/* 屏幕上一块瓦片不小于它本身像素的一半就用更细的级 */let l=Math.floor(Math.log2(1/(cam.z*dpr)));return Math.max(0,Math.min(NL-1,l))}
let drawn=0,hdrawn=0;
/* ── 街巷级（cs33b）：放大到一块瓦片比它本身像素还大时，地面用不含街和房子的地面瓦片，街和房子按块取矢量画（和 render_ng 同一画法） */

/* ── 街巷级的人和船（cs33c）：只在视口和外面一圈瓦片里活；离开就收掉，远处不跑。
   人只走烤瓦片时验过「全程是陆地」的街（定律 1，段上 w 位）；船只在「格里 ≥95% 是水、且四周 8 格也是水」的格子里挪（定律 2）。
   人数跟这块瓦片当年站着的房子走（每 15 栋一个人，至多 30），船数跟水格走（每 400 格一条，至多 3）。 */
const LIFE={tiles:new Map(),walkers:0,ships:0};const WCELL=()=>M.water_cell,NCELL=()=>M.water_cells_n;
function rnd(seed){let x=seed|0||1;return()=>((x^=x<<13,x^=x>>>17,x^=x<<5)>>>0)/4294967296}
function lifeKey(Y){return Y}
function activeTiles(){const x0=cam.x-W/2/cam.z,y0=cam.y-H/2/cam.z,x1=cam.x+W/2/cam.z,y1=cam.y+H/2/cam.z,a=[];
  for(let ty=Math.floor(y0/TP)-1;ty<=Math.floor(y1/TP)+1;ty++)for(let tx=Math.floor(x0/TP)-1;tx<=Math.floor(x1/TP)+1;tx++)a.push([tx,ty]);return a}
let NODE=new Map();
function nk(x,y){return Math.round(x)+','+Math.round(y)}
function lifeSync(Y){let nb=1;const want=new Set(),gi=M.street.ground_keys.indexOf(gkey(Y)),K=String(gkey(Y));
  for(const [tx,ty] of activeTiles()){const k=tx+'_'+ty;want.add(k);const v=vtile(tx,ty);if(!v.ok)continue;let L=LIFE.tiles.get(k);
    if(L&&L.Y===Y)continue;
    if(nb--<=0){dirty=true;continue}
    const segs=v.d.s.filter(q=>q[6]<=Y&&!(q[7]&&q[7]<=Y)&&(q[9]>>gi&1));
    const nh=v.d.h.filter(h=>h[0]<=Y&&Y<h[1]).length,r=rnd((tx*73856093)^(ty*19349663)^Y);
    const W_=[];const nw=segs.length?Math.min(30,Math.floor(nh/15)):0;
    for(let i=0;i<nw;i++){const q=segs[Math.floor(r()*segs.length)];W_.push({q,t:r(),dir:r()<.5?1:-1,sp:4+r()*4,col:['#7a3b2a','#3d5a7a','#6b6b3a','#8a6d4a','#4a3a5a','#a0522d'][Math.floor(r()*6)]})}
    const S_=[];const wg=v.d.wg&&v.d.wg[K];
    if(wg){const N=NCELL(),ok=(i,j)=>{for(let a=-4;a<=4;a++)for(let b=-4;b<=4;b++){const ii=i+a,jj=j+b;if(ii<0||jj<0||ii>=N||jj>=N||wg[jj*N+ii]!=='1')return false}return true};
      const cand=[];for(let j=4;j<N-4;j++)for(let i=4;i<N-4;i++)if(ok(i,j))cand.push([i,j]);
      const ns=Math.min(3,Math.floor(cand.length/400));
      for(let n=0;n<ns;n++){const [i,j]=cand[Math.floor(r()*cand.length)];const cx=tx*TP+(i+.5)*WCELL(),cy=ty*TP+(j+.5)*WCELL();S_.push({x:cx,y:cy,i,j,tx,ty,tgt:null,ok,ang:r()*6.28,sp:2+r()*2})}}
    LIFE.tiles.set(k,{Y,W:W_,S:S_,segs})}
  for(const k of [...LIFE.tiles.keys()])if(!want.has(k))LIFE.tiles.delete(k);
  NODE=new Map();for(const L of LIFE.tiles.values())for(const q of L.segs)for(const e of [0,1]){const key=nk(q[e*2],q[e*2+1]);if(!NODE.has(key))NODE.set(key,[]);NODE.get(key).push([q,e])}}
let lastT=0;
function lifeStep(dt){let nw=0,ns=0;
  for(const L of LIFE.tiles.values()){
    for(const w of L.W){const q=w.q,len=Math.hypot(q[2]-q[0],q[3]-q[1])||1;w.t+=w.dir*w.sp*dt/len;
      if(w.t>1||w.t<0){const e=w.t>1?1:0;const nx=q[e*2],ny=q[e*2+1];const nb=(NODE.get(nk(nx,ny))||[]).filter(([qq])=>qq!==q);
        if(nb.length){const [qq,ee]=nb[Math.floor(Math.random()*nb.length)];w.q=qq;w.t=ee;w.dir=ee?-1:1}else{w.dir=-w.dir;w.t=e}}nw++}
    for(const b of L.S){if(!b.tgt){const N=NCELL(),opts=[];for(let a=-1;a<=1;a++)for(let c2=-1;c2<=1;c2++){if(!a&&!c2)continue;const i=b.i+a,j=b.j+c2;if(i>3&&j>3&&i<N-4&&j<N-4&&b.ok(i,j))opts.push([i,j])}
        if(opts.length){/* 大致保持航向 */opts.sort((p,q2)=>Math.abs(Math.atan2(p[1]-b.j,p[0]-b.i)-b.ang)-Math.abs(Math.atan2(q2[1]-b.j,q2[0]-b.i)-b.ang)+(Math.random()-.5)*2);b.tgt=opts[0]}}
      if(b.tgt){const gx=b.tx*TP+(b.tgt[0]+.5)*WCELL(),gy=b.ty*TP+(b.tgt[1]+.5)*WCELL(),dx=gx-b.x,dy=gy-b.y,d=Math.hypot(dx,dy);
        if(d<0.5){b.i=b.tgt[0];b.j=b.tgt[1];b.tgt=null}else{const st=Math.min(d,b.sp*dt);b.x+=dx/d*st;b.y+=dy/d*st;b.ang=Math.atan2(dy,dx)}}ns++}}
  LIFE.walkers=nw;LIFE.ships=ns}
function lifeDraw(){for(const L of LIFE.tiles.values()){
    for(const b of L.S){ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.ang);ctx.scale(2.1,2.1);/* 船身约 44 像素，比画上停着的大船（约 60）小一号 */ctx.fillStyle='rgba(20,40,40,.25)';ctx.beginPath();ctx.ellipse(1.5,2,10,3.4,0,0,6.283);ctx.fill();ctx.fillStyle='#6b4423';ctx.beginPath();ctx.moveTo(-10,0);ctx.quadraticCurveTo(-8,-3.4,4,-3.2);ctx.quadraticCurveTo(10,-2,11,0);ctx.quadraticCurveTo(10,2,4,3.2);ctx.quadraticCurveTo(-8,3.4,-10,0);ctx.fill();ctx.strokeStyle='#3e2612';ctx.lineWidth=.6;ctx.stroke();ctx.fillStyle='rgba(236,224,196,.95)';ctx.beginPath();ctx.moveTo(-1,-7);ctx.quadraticCurveTo(2.5,0,-1,7);ctx.lineTo(0.6,7);ctx.quadraticCurveTo(4,0,0.6,-7);ctx.fill();ctx.restore()}
    for(const w of L.W){const q=w.q,x=q[0]+(q[2]-q[0])*w.t,y=q[1]+(q[3]-q[1])*w.t,nx=-(q[3]-q[1]),ny=q[2]-q[0],nl=Math.hypot(nx,ny)||1,off=(w.dir>0?1:-1)*Math.min(2,q[4]*0.25);
      const px=x+nx/nl*off,py=y+ny/nl*off;ctx.fillStyle='rgba(40,25,10,.3)';ctx.beginPath();ctx.ellipse(px+.4,py+.6,0.9,0.5,0,0,6.283);ctx.fill();
      ctx.fillStyle=w.col;ctx.beginPath();ctx.arc(px,py,1.1,0,6.283);ctx.fill();ctx.fillStyle='#e8c9a0';ctx.beginPath();ctx.arc(px,py-0.9,0.6,0,6.283);ctx.fill()}}}
const STREET_Z=1.15,vcache=new Map();let vloads=0;
function vtile(tx,ty){const k=tx+'_'+ty;let t=vcache.get(k);if(t!==undefined)return t;t={ok:false};vcache.set(k,t);vloads++;
  fetch('vec/'+k+'.json').then(r=>r.ok?r.json():null).then(j=>{if(j){t.d=j;t.ok=true;dirty=true;cver++}}).catch(()=>{});
  if(vcache.size>60){for(const [kk,v] of vcache){if(vcache.size<=40)break;if(v.ok)vcache.delete(kk)}}return t}
function gkey(Y){const ks=M.street.ground_keys;return ks.find(k=>Y<=k)??ks[ks.length-1]}
const SSTY={m:['rgba(118,104,86,.75)','rgb(174,163,144)'],s:['rgba(140,118,88,.43)','rgba(200,182,146,.84)'],c:['rgba(140,118,88,.35)','rgba(203,186,150,.75)'],l:[null,'rgba(205,189,154,.65)']};
const LAY=new Map();let layBudget=3;
function paintStreets(g,d,Y){g.lineCap='round';
  g.strokeStyle='rgba(150,126,92,.5)';g.lineWidth=1.8;g.beginPath();for(const q of d.s)if(q[8]<=Y&&Y<q[6]){g.moveTo(q[0],q[1]);g.lineTo(q[2],q[3])}g.stroke();
  for(const pas of [0,1])for(const k of 'lcsm'){const col=SSTY[k][pas];if(!col)continue;g.strokeStyle=col;
    const ws=new Map();for(const q of d.s){if(q[5]!==k||q[6]>Y||(q[7]&&q[7]<=Y))continue;const w=q[4]+(pas?0:2);let p=ws.get(w);if(!p)ws.set(w,p=new Path2D());p.moveTo(q[0],q[1]);p.lineTo(q[2],q[3])}
    for(const [w,p] of ws){g.lineWidth=w;g.stroke(p)}}}
function paintHouses(g,d,Y){const hs=d.h.filter(h=>h[0]<=Y&&Y<h[1]);hs.sort((a,b)=>a[2]-b[2]);
  g.fillStyle='rgba(50,32,14,.27)';for(const h of hs){const s=h[3];g.beginPath();g.moveTo(s[0],s[1]);for(let i=2;i<s.length;i+=2)g.lineTo(s[i],s[i+1]);g.fill()}
  g.lineWidth=0.5;g.lineCap='butt';
  for(const h of hs)for(const [kd,p,c] of h[4]){if(p.length<4)continue;g.beginPath();g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);
    if(kd===0){if(p.length>=6){g.fillStyle='#'+c;g.fill()}}else{if(kd===1)g.closePath();g.strokeStyle='#'+c;g.stroke()}}
  return hs.length}
function layer(kind,tx,ty,Y,v,zr,gim){const k=kind+tx+'_'+ty+'_'+Y+'_'+zr;let L=LAY.get(k);if(L){LAY.delete(k);LAY.set(k,L);return L}
  if(layBudget<=0){dirty=true;cver++;return null}layBudget--;
  const MG=24,sz=TP+2*MG,cv=document.createElement('canvas');cv.width=cv.height=Math.ceil(sz*zr);const g=cv.getContext('2d');g.setTransform(zr,0,0,zr,(MG-tx*TP)*zr,(MG-ty*TP)*zr);
  L={cv,MG,sz,n:0};if(kind==='s'){g.drawImage(gim,tx*TP,ty*TP,TP+0.5,TP+0.5);paintStreets(g,v.d,Y)}else L.n=paintHouses(g,v.d,Y);
  LAY.set(k,L);while(LAY.size>90)LAY.delete(LAY.keys().next().value);return L}
function prepStreet(Y){const x0=cam.x-W*PCK/2/cam.z,y0=cam.y-H*PCK/2/cam.z,x1=cam.x+W*PCK/2/cam.z,y1=cam.y+H*PCK/2/cam.z,K=gkey(Y);
  const zr=Math.min(4,STREET_Z*2**Math.ceil(Math.log2(Math.max(cam.z*dpr,STREET_Z)/STREET_Z)));
  for(let ty=Math.floor(y0/TP);ty<=Math.floor(y1/TP);ty++)for(let tx=Math.floor(x0/TP);tx<=Math.floor(x1/TP);tx++){
    const g=tile('g/'+K,0,tx,ty,true);let gim=null;if(g&&g.ok)gim=g.im;else{const t=tile(Y,0,tx,ty);if(t&&t.ok)gim=t.im}
    const v=vtile(tx,ty);if(!gim||!v.ok)continue;
    for(const kd of 'sh')if(!LAY.has(kd+tx+'_'+ty+'_'+Y+'_'+zr)){layBudget=1;layer(kd,tx,ty,Y,v,zr,gim);return true}}
  return false}
function drawStreet(Y){const x0=pc.x-W*PCK/2/cam.z,y0=pc.y-H*PCK/2/cam.z,x1=pc.x+W*PCK/2/cam.z,y1=pc.y+H*PCK/2/cam.z;const K=gkey(Y),vs=[];
  layBudget=0;const zr=Math.min(4,STREET_Z*2**Math.ceil(Math.log2(Math.max(cam.z*dpr,STREET_Z)/STREET_Z)));
  for(let ty=Math.floor(y0/TP);ty<=Math.floor(y1/TP);ty++)for(let tx=Math.floor(x0/TP);tx<=Math.floor(x1/TP);tx++){
    const g=tile('g/'+K,0,tx,ty,true);let gim=null;if(g&&g.ok)gim=g.im;else{const t=tile(Y,0,tx,ty);if(t&&t.ok)gim=t.im}
    const v=vtile(tx,ty);if(!gim)continue;
    if(v.ok){const L=layer('s',tx,ty,Y,v,zr,gim);if(L){ctx.drawImage(L.cv,tx*TP-L.MG,ty*TP-L.MG,L.sz,L.sz);drawn++}}else{ctx.drawImage(gim,tx*TP,ty*TP,TP+0.5,TP+0.5);drawn++}
    if(v.ok)vs.push([tx,ty,v])}
  hdrawn=0;for(const [tx,ty,v] of vs){const L=layer('h',tx,ty,Y,v,zr);if(L){ctx.drawImage(L.cv,tx*TP-L.MG,ty*TP-L.MG,L.sz,L.sz);hdrawn+=L.n}}}
function drawYear(Y,alpha){const l=level(),f=2**l,ts=TP*f;   /* 这一级一块瓦片在级 0 像素里的边长 */
  const x0=cam.x-W/2/cam.z,y0=cam.y-H/2/cam.z,x1=cam.x+W/2/cam.z,y1=cam.y+H/2/cam.z;
  ctx.globalAlpha=alpha;
  for(let ty=Math.floor(y0/ts);ty<=Math.floor(y1/ts);ty++)for(let tx=Math.floor(x0/ts);tx<=Math.floor(x1/ts);tx++){
    let t=tile(Y,l,tx,ty);
    if(t&&t.ok){ctx.drawImage(t.im,tx*ts,ty*ts,ts+0.5,ts+0.5);drawn++;continue}
    /* 还没到：先用粗一级的瓦片顶着（不出现空洞） */
    for(let up=l+1;up<NL;up++){const g=2**(up-l),p=tile(Y,up,Math.floor(tx/g),Math.floor(ty/g));if(p&&p.ok){const s=TP*2**up,sx=(tx%g)*TP/g,sy=(ty%g)*TP/g;ctx.drawImage(p.im,sx,sy,TP/g,TP/g,tx*ts,ty*ts,ts+0.5,ts+0.5);break}}}
  ctx.globalAlpha=1}
function frame(now){now=now||performance.now();const dt=Math.min(0.1,(now-lastT)/1000||0);lastT=now;const street=cam.z*dpr>=STREET_Z;
  let redraw=false,wasDirty=dirty;
  if(street){const mx=W*(PCK-1)/2/cam.z*0.8,my=H*(PCK-1)/2/cam.z*0.8;
    const prepped=dirty&&prepStreet(YEAR);if(prepped)dirty=true;
    redraw=!prepped&&dirty&&(!pc.ok||pc.z!==cam.z||pc.Y!==YEAR||pc.ver!==cver||fade>0||Math.abs(cam.x-pc.x)>mx||Math.abs(cam.y-pc.y)>my);
    if(fade>0){fade=Math.max(0,fade-0.06);dirty=true}
    if(redraw){dirty=false;drawn=0;pc.ok=true;pc.x=cam.x;pc.y=cam.y;pc.z=cam.z;pc.Y=YEAR;pc.ver=cver;const OW=off.width,OH=off.height;
      octx.setTransform(1,0,0,1,0,0);octx.fillStyle='#cdb68c';octx.fillRect(0,0,OW,OH);
      octx.setTransform(dpr*cam.z,0,0,dpr*cam.z,OW/2-dpr*pc.x*cam.z,OH/2-dpr*pc.y*cam.z);ctx=octx;drawStreet(YEAR);ctx=ctx0;octx.setTransform(1,0,0,1,0,0)}
    else if(!prepped)dirty=false;
    if(wasDirty)lifeSync(YEAR);
    if(redraw||wasDirty)document.getElementById('st').textContent=`${YEAR} 年 · 级 ${level()} · 街巷级 · 矢量房子 ${hdrawn} 栋 · 画了 ${drawn} 块瓦片 · 已请求 ${loads} 块 · 缓存 ${cache.size}`;
    lifeStep(dt);ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#cdb68c';ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(off,Math.round(((pc.x-cam.x)*cam.z+W*(1-PCK)/2)*dpr),Math.round(((pc.y-cam.y)*cam.z+H*(1-PCK)/2)*dpr));
    ctx.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*(W/2-cam.x*cam.z),dpr*(H/2-cam.y*cam.z));lifeDraw();ctx.setTransform(1,0,0,1,0,0);
    ctx.lineWidth=1;const st=document.getElementById('st');st.dataset.life=`人 ${LIFE.walkers} · 船 ${LIFE.ships}`;if(!st.textContent.includes('· 人 '))st.textContent+=' · '+st.dataset.life;else st.textContent=st.textContent.replace(/· 人 \d+ · 船 \d+/,'· '+st.dataset.life)}
  else{pc.ok=false;if(LIFE.tiles.size){LIFE.tiles.clear();LIFE.walkers=LIFE.ships=0}
  if(fade>0){fade=Math.max(0,fade-0.06);dirty=true}
  if(dirty){dirty=false;drawn=0;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#cdb68c';ctx.fillRect(0,0,W,H);
    ctx.setTransform(dpr*cam.z,0,0,dpr*cam.z,dpr*(W/2-cam.x*cam.z),dpr*(H/2-cam.y*cam.z));
    hdrawn=0;if(fade>0&&prevYear!=null)drawYear(prevYear,1);drawYear(YEAR,fade>0?1-fade:1);
    ctx.lineWidth=2/cam.z;ctx.font=(16/cam.z)+'px serif';
    for(const q in M.quarters){const [x,y,w,h]=M.quarters[q];ctx.strokeStyle='rgba(212,168,90,.7)';ctx.strokeRect(x,y,w,h);ctx.fillStyle='#3a2a14';ctx.fillText((NAMES[q]||q)+' →',x+8/cam.z,y+22/cam.z)}
    ctx.setTransform(1,0,0,1,0,0);
    document.getElementById('st').textContent=`${YEAR} 年 · 级 ${level()} · 画了 ${drawn} 块瓦片 · 已请求 ${loads} 块 · 缓存 ${cache.size}`}}
  ctx=ctx0;requestAnimationFrame(frame)}
const ui=document.getElementById('ui');
for(const Y of M.years){const b=document.createElement('button');b.className='b'+(Y===YEAR?' on':'');b.textContent=Y+' 年';b.onclick=()=>{if(Y===YEAR)return;prevYear=YEAR;YEAR=Y;fade=1;[...ui.children].forEach(x=>x.classList.toggle('on',x===b))};ui.appendChild(b)}
/* 拖、滚轮、双指 */
let drag=null,pts=new Map();
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,moved:0}});
c.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pts.get(e.pointerId);
